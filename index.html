<!doctype html>
<html lang="id" class="bg-[#fdfbf7] dark:bg-[#070913]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Platform Web Edukasi UTBK-SNBT & SMA berskala besar, bebas biaya (Rp0), latency rendah, adaptif Desktop & Mobile." />
    <title>SkolAce | UTBK-SNBT & SMA</title>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
    <script>
      (function() {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          var saved = localStorage.getItem('kognitedu_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-cyan-500 selection:text-white bg-[#fdfbf7] dark:bg-[#070913] text-slate-900 dark:text-[#f8fafc]">
    <div id="root"></div>
    <!-- Development entry point -->
    <script type="module" src="/src/main.tsx"></script>
    <!-- Fallback production bundle for static hosting (e.g. GitHub Pages) -->
    <script>
      window.addEventListener('error', function (e) {
        if (e.target && e.target.src && e.target.src.includes('main.tsx')) {
          console.warn('Switching to production bundle fallback...');
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/index.js';
          document.body.appendChild(script);
        }
      }, true);
    </script>
  </body>
</html>
